<play-example title="Default">
  <play-note>
    Three bars that turn into a cross while it's expanded. It has one name,
    such as "Menu", and <code>aria-expanded</code> says whether it's open.
    Press it to see it turn.
  </play-note>
  <button class="hbutton hmenu-button" data-variant="secondary" data-size="small" type="button" aria-label="Menu" aria-expanded="false">
    <play-icon name="menu-bars" class="hicon hmenu-button-bars"></play-icon>
  </button>
</play-example>
