<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%235e3de8' d='M5 0H11C14.2 0 16 1.8 16 5V11C16 14.2 14.2 16 11 16H5C1.8 16 0 14.2 0 11V5C0 1.8 1.8 0 5 0Z'/%3E%3Cpath fill='%23fff' d='M9 12H1A8 8 0 0 1 9 4ZM10 9V4A5 5 0 0 1 15 9ZM13 10H15A2 2 0 0 1 13 12ZM10 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0Z'/%3E%3C/svg%3E"
    />
    <script>
      // Light or dark, set before anything shows: the last choice, or else the system's.
      {
        let saved;
        try {
          saved = localStorage.getItem("harmo-playground-color-scheme");
        } catch {}
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      }
      // The accent last chosen in the sidebar; purple, the default, needs none.
      {
        let accent;
        try {
          accent = localStorage.getItem("harmo-playground-accent");
        } catch {}
        if (accent && accent !== "purple" && /^[a-z]+$/.test(accent)) {
          document.documentElement.dataset.harmoAccent = accent;
        }
      }
    </script>
    <link rel="stylesheet" href="{{harmo}}" />
    <link rel="stylesheet" href="playground.css" />
    <script src="playground.js" defer></script>
    {{scripts}}
  </head>
  <body>
    <a class="play-skip" href="#play-main">Skip to content</a>
    <header class="play-header">
      <button
        class="hbutton play-menu-button"
        data-variant="tertiary"
        type="button"
        popovertarget="play-nav"
        aria-label="Components"
      >
        <play-icon name="menu" class="hicon"></play-icon>
      </button>
      <a class="play-brand" href="index.html">
        <play-icon name="mark" class="play-mark"></play-icon>
        Harmo
      </a>
      <span class="htag">{{version}}</span>
      <div class="play-header-end">
        <div class="hfield" data-orientation="horizontal">
          <input class="hswitch" type="checkbox" role="switch" id="play-dark" />
          <label class="hlabel" for="play-dark">Dark</label>
        </div>
        <script>
          document.getElementById("play-dark").checked = document.documentElement.style.colorScheme === "dark";
        </script>
        <a class="hlink play-header-link" href="{{docs}}">Docs</a>
      </div>
    </header>
    <div class="play-layout">
      <div class="hsidebar play-nav" id="play-nav" popover>
        <div class="hsidebar-header">
          {{accent}}
        </div>
        <nav class="hsidebar-nav" aria-label="Components">
          {{nav}}
        </nav>
      </div>
      <main class="play-main" id="play-main" tabindex="-1">
        {{content}}
      </main>
    </div>
    <footer class="play-footer">
      <p>
        Harmo {{version}}. {{about}}
      </p>
    </footer>
  </body>
</html>
