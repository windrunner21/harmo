[tools]
bun = "latest"
# Only for Playwright's test runner, which runs on Node; Bun does the rest.
node = "lts"

# Standalone Dart Sass. The aqua registry lists only the musl build for Linux,
# which cannot run on glibc systems, so name the glibc builds explicitly.
[tools."github:sass/dart-sass"]
version = "1.105.1"
version_prefix = ""

[tools."github:sass/dart-sass".platforms]
linux-x64 = { asset_pattern = "dart-sass-*-linux-x64.tar.gz" }
linux-arm64 = { asset_pattern = "dart-sass-*-linux-arm64.tar.gz" }

[tasks."build:accents"]
description = "Regenerate packages/css/src/accents.scss from packages/cli/src/palettes/palettes.ts"
run = "bun packages/css/accents/generate.ts"

[tasks."build:css"]
description = "Compile Harmo SCSS into CSS"
# Start clean so removed sources leave no stale CSS, and fail without writing
# error stylesheets. Every non-partial file in src becomes dist/<name>.css.
run = [
  "rm -rf packages/css/dist",
  "sass --no-source-map --no-error-css packages/css/src:packages/css/dist",
]

[tasks."watch:css"]
description = "Recompile Harmo SCSS on change"
run = "sass --watch --no-source-map packages/css/src:packages/css/dist"

[tasks."build:react"]
description = "Compile the React package into packages/react/dist, as ES modules and CommonJS"
# One file for each source file, so each keeps its own "use client". Start clean
# so removed sources leave nothing stale. The package is "type": "module", so
# the CommonJS folder says what it is, for Node and TypeScript.
dir = "{{config_root}}/packages/react"
run = [
  "rm -rf dist",
  "bunx tsc -p tsconfig.esm.json",
  "bunx tsc -p tsconfig.cjs.json",
  "echo '{ \"type\": \"commonjs\" }' > dist/cjs/package.json",
]

[tasks."watch:react"]
description = "Recompile the React package's ES modules on change"
dir = "{{config_root}}/packages/react"
run = "bunx tsc -p tsconfig.esm.json --watch --preserveWatchOutput"

[tasks."build:cli"]
description = "Build the CLI: the components it copies into packages/cli/registry, and its code into packages/cli/dist"
depends = ["build:css"]
dir = "{{config_root}}/packages/cli"
run = ["rm -rf dist registry", "bun build-registry.ts", "bunx tsc -p tsconfig.build.json"]

[tasks."build:playground"]
description = "Build the HTML playground into examples/html/dist"
depends = ["build:css"]
run = "bun examples/html/build.ts"

[tasks."watch:playground"]
description = "Rebuild the HTML playground on change (run watch:css alongside)"
run = "bun examples/html/build.ts --watch"

[tasks."build:react-playground"]
description = "Build the React playground into examples/react/dist"
depends = ["build:css", "build:react"]
run = "bun examples/react/build.ts"

[tasks."watch:react-playground"]
description = "Rebuild the React playground on change (run watch:css and watch:react alongside)"
depends = ["build:react"]
run = "bun examples/react/build.ts --watch"

[tasks."test:react"]
description = "Compare the React examples' markup with the HTML examples, and check the compiled package"
depends = ["build:react"]
dir = "{{config_root}}/examples/react"
run = "bun test"

[tasks."test:cli"]
description = "Test the CLI: what it copies, and that the copies type-check"
depends = ["build:cli"]
dir = "{{config_root}}/packages/cli"
run = "bun test"

[tasks."test:browser"]
description = "Build both playgrounds, then test them in Chromium"
# CI runs every browser the config lists: bunx playwright test.
depends = ["build:playground", "build:react-playground"]
dir = "{{config_root}}/tests"
run = "bunx playwright test --project=chromium"

[tasks."test:browser:all"]
description = "Build both playgrounds, then test them in Chromium, Firefox, and WebKit, in Docker"
# Playwright's image, with the same browsers CI uses, for systems Playwright
# doesn't support, such as Arch. Its version must match @playwright/test in
# tests/package.json. Each run's container is removed when it ends.
depends = ["build:playground", "build:react-playground"]
run = 'docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -v "{{config_root}}:{{config_root}}" -w "{{config_root}}/tests" mcr.microsoft.com/playwright:v1.64.1-noble npx playwright test'

[tasks."check:react"]
description = "Type-check the React package, the React playground, the CLI, and the browser tests"
# bun check, Bun's built-in type checker, needs Bun 1.4.3 or later. The
# playground imports the package's compiled types, as an app would.
depends = ["build:react"]
run = [
  "cd packages/react && bun check",
  "cd examples/react && bun check",
  "cd packages/cli && bun check",
  "cd tests && bun check",
]
