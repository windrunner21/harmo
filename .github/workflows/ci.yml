# Checks every push to master and every pull request: the types and the
# markup test in one job, and the browser tests in three jobs per browser,
# each running a third of them, all side by side, as Playwright's CI and
# sharding guides set them up (playwright.dev/docs/ci,
# playwright.dev/docs/test-sharding). A last job merges their reports into
# one, with each failure's trace.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types and markup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Bun, Dart Sass, and Node, at the versions mise.toml names.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile

      - run: mise run check:react
      - run: mise run test:react
      - run: mise run test:cli

  browser:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-24.04
    # Past the tests' own 15 minutes, in tests/playwright.config.ts, which
    # stop with their report written.
    timeout-minutes: 20
    # Playwright's image, as its CI guide runs it, with the browsers and their
    # system libraries in it: nothing installs with apt, which took up to 13
    # minutes, and nothing downloads or needs a cache. Its version must match
    # @playwright/test in tests/package.json, and mise.toml's. The runner's
    # user, as the guide has it, and --init and --ipc=host, as its Docker
    # guide recommends, the second because Chromium can otherwise run out of
    # shared memory.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --init --ipc=host
    strategy:
      # One job failing doesn't stop the others.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # A third of the browser's tests each, at the same time, none left
        # out. By the tests' times the thirds come out even; halves didn't,
        # in WebKit.
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile

      - run: mise run build:playground
      - run: mise run build:react-playground

      - working-directory: tests
        run: bunx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # This third's report, for the report job, whether its tests passed or
      # failed. Blob files are named by browser and third, so none overwrite
      # another when they're merged.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shardIndex }}
          path: tests/blob-report
          retention-days: 1

  report:
    name: Report
    # After the browser jobs, also when some failed.
    if: ${{ !cancelled() }}
    needs: [browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The same image and user as the browser jobs, so the reports' paths are
    # the ones it reads them from.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          path: tests/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # One HTML report for every browser, and each failure noted once on the
      # pull request: from each job, a matrix would repeat them.
      - working-directory: tests
        run: bunx playwright merge-reports --reporter html,github ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: tests/playwright-report
          retention-days: 14
