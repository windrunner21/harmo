# Checks every push to master and every pull request: the types and the
# markup test in one job, and the browser tests in two jobs per browser, each
# running half of them, all side by side. Each browser job keeps Playwright's
# report, with a trace of each failed test.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types and markup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Bun, Dart Sass, and Node, at the versions mise.toml names.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile

      - run: mise run check:react
      - run: mise run test:react
      - run: mise run test:cli

  browser:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One job failing doesn't stop the others.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Half of the browser's tests each, at the same time: the whole run
        # takes about half as long, with none left out.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: bun install --frozen-lockfile

      - run: mise run build:playground
      - run: mise run build:react-playground

      # This job's browser, kept between runs until Playwright's version or
      # the runner's Ubuntu changes, and the system libraries it needs,
      # installed each time. Playwright downloads a build for each Ubuntu:
      # one cached on a newer Ubuntu can't start on an older one, as WebKit
      # couldn't when the runner was pinned to 24.04.
      - id: system
        run: echo "ubuntu=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.system.outputs.ubuntu }}-${{ matrix.browser }}-${{ hashFiles('tests/package.json') }}
      - if: steps.browser.outputs.cache-hit != 'true'
        working-directory: tests
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - if: steps.browser.outputs.cache-hit == 'true'
        working-directory: tests
        run: bunx playwright install-deps ${{ matrix.browser }}

      - working-directory: tests
        run: bunx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2

      # However the job ends, also when it runs out of time.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/playwright-report
          retention-days: 14
